<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Barbearia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <h2>✂️ Agendamento Rápido</h2>
            <p>Olá, {{ usuario.nome }}! Escolha seu horário</p>
        </header>

        <section class="cartao">
            <div class="grupo-formulario">
                <label for="data">1. Selecione uma data:</label>
                <input type="date" id="data" class="campo-data">
            </div>
            
            <!-- Dados preenchidos automaticamente e travados para edição -->
            <div class="grupo-formulario">
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" class="campo-data" value="{{ usuario.nome }}" readonly style="background-color: #e9ecef; cursor: not-allowed;">
            </div>
            
            <div class="grupo-formulario">
                <label for="telefone">WhatsApp:</label>
                <input type="text" id="telefone" class="campo-data" value="{{ usuario.celular }}" readonly style="background-color: #e9ecef; cursor: not-allowed;">
            </div>
            
            <!-- Guardamos o ID do usuário de forma invisível aqui -->
            <input type="hidden" id="usuario-id" value="{{ usuario.id }}">
            
            <div class="grupo-formulario">
                <label for="horario">4. Escolha o horário:</label>
                <select id="horario" class="campo-data">
                    <option value="" disabled selected>Escolha seu horário...</option>
                    <option value="08:00">08:00</option>
                    <option value="08:30">08:30</option>
                    <option value="09:00">09:00</option>
                    <option value="09:30">09:30</option>
                    <option value="10:00">10:00</option>
                    <option value="10:30">10:30</option>
                    <option value="11:00">11:00</option>
                    <option value="11:30">11:30</option>
                    <option value="13:00">13:00</option>
                    <option value="13:30">13:30</option>
                    <option value="14:00">14:00</option>
                    <option value="14:30">14:30</option>
                    <option value="15:00">15:00</option>
                    <option value="15:30">15:30</option>
                    <option value="16:00">16:00</option>
                    <option value="16:30">16:30</option>
                    <option value="17:00">17:00</option>
                    <option value="17:30">17:30</option>
                    <option value="18:00">18:00</option>
                    <option value="18:30">18:30</option>
                     <option value="19:00">19:00</option>
                </select>
            </div>
            
            <button id="btn-agendar" class="btn-confirmar">Confirmar Agendamento</button>
            
            <div class="links-uteis" style="margin-top: 20px; text-align: center;">
                <a href="/perfil">Voltar ao Meu Perfil</a>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
