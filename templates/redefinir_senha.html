<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Barbearia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <h2>🔒 Nova Senha</h2>
            <p>Crie e confirme sua nova senha de acesso</p>
        </header>

        <section class="cartao">
            <form id="formRedefinir">
                <input type="hidden" id="token" value="{{ token }}">

                <div class="grupo-formulario">
                    <label for="nova_senha">Nova Senha:</label>
                    <div class="campo-senha-container">
                        <input type="password" id="nova_senha" required class="campo-entrada" placeholder="Digite sua nova senha">
                        <button type="button" class="btn-toggle-senha" data-alvo="nova_senha" aria-label="Visualizar senha" title="Visualizar senha">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="confirmar_nova_senha">Confirmar Nova Senha:</label>
                    <div class="campo-senha-container">
                        <input type="password" id="confirmar_nova_senha" required class="campo-entrada" placeholder="Repita a nova senha">
                        <button type="button" class="btn-toggle-senha" data-alvo="confirmar_nova_senha" aria-label="Visualizar senha" title="Visualizar senha">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primario">Salvar Nova Senha</button>
            </form>

            <a href="/" class="link-voltar">Voltar ao Início</a>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
