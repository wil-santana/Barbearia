<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Cliente - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container" style="max-width: 500px;">
        <header class="cabecalho">
            <h2>👤 Ficha do Cliente</h2>
            <p>Informações cadastrais</p>
        </header>

        <section class="cartao">
            <div class="grupo-formulario">
                <label><strong>Nome Completo:</strong></label>
                <div class="dado-ficha">{{ cliente.nome }}</div>
            </div>

            <div class="grupo-formulario">
                <label><strong>Celular (WhatsApp):</strong></label>
                <div class="dado-ficha">{{ cliente.celular }}</div>
            </div>

            <div class="grupo-formulario">
                <label><strong>E-mail:</strong></label>
                <div class="dado-ficha">{{ cliente.email }}</div>
            </div>

            <div class="grupo-formulario">
                <label><strong>Data de Nascimento:</strong></label>
                <div class="dado-ficha">{{ cliente.nascimento }}</div>
            </div>

            <a href="/admin" class="btn-primario link-voltar">Voltar ao Painel Admin</a>
        </section>
    </main>
</body>
</html>
